# The test video played as tower-01's camera.
#
# vtest.avi is OpenCV's sample surveillance clip (768x576, 10 frames/s, 80 s):
# people walking across a paved area, seen from a fixed camera about 8 m up.
# It is downloaded to edge-ai/var/video/ and checked against sha256.
source: tower-01

video:
  file: vtest.avi
  url: https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/vtest.avi
  sha256: 45cddc9490be69345cbdab64ca583be65987e864ca408038e648db99e10516cf

camera:
  kind: tower

  # NOT A SURVEY. Nobody measured this scene, and it is not at our site. The
  # control points below place the clip in front of tower-01 so the whole
  # chain can be tested with believable numbers:
  #
  # - camera height 8.3 m and tilt 27 degrees down, estimated from the clip
  #   itself: how tall people's boxes are against where their feet are,
  #   taking a person as 1.7 m;
  # - a 50 degree lens, assumed;
  # - the tower's position (8.8945, 7.2655, near Briech home) and camera
  #   heading (30 degrees) from sim/scenarios/tower-walk.yaml. Moved from
  #   near Lagos on 2026-11-18 with the default watch zone; each point keeps
  #   its metres from the tower.
  #
  # Distances between people in the clip should be right to roughly 20 %;
  # where the scene sits on the map is invented. A real tower gets at least
  # four (better six or more) surveyed ground points here instead.
  #
  # control_error_m is how well the control points are known, in metres, one
  # sigma. It is the floor of every error_m this camera reports. 4 m: the
  # 1.7 m person and the lens guess, at the 10 to 30 m these people walk at.
  control_error_m: 4.0
  # A position vaguer than this is not sent; the detection goes without geo.
  max_error_m: 30.0

  points:
    - { px: [60, 180],  lat: 8.8947281, lon: 7.2655306 }   # 23.7 m ahead, 9.8 m left
    - { px: [720, 120], lat: 8.8946802, lon: 7.2657377 }   # 30.4 m ahead, 12.6 m right
    - { px: [720, 480], lat: 8.8945541, lon: 7.2655855 }   # 9.9 m ahead, 5.1 m right
    - { px: [120, 480], lat: 8.8945952, lon: 7.2655133 }   # 9.9 m ahead, 4.0 m left
