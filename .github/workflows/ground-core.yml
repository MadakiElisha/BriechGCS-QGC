name: ground-core

on:
  push:
    paths: [ "ground-core/**", "schemas/**", "sim/**", "ops/**", "edge-ai/**", ".github/workflows/ground-core.yml" ]
  pull_request:
    paths: [ "ground-core/**", "schemas/**", "sim/**", "ops/**", "edge-ai/**", ".github/workflows/ground-core.yml" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ground-core/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Schema checks and coordinator unit tests
        run: python -m pytest -q

  # Edge pipeline: publisher (messages against schemas/, disk queue, late flag), geolocation, tracker.
  # No model and no video are downloaded here.
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge-ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Edge pipeline unit tests
        run: python -m pytest -q

  # Scenario replay on the real stack (handoff: level 1, every push, broker in a
  # container): dev certificates and secrets, Mosquitto in Docker, a coordinator,
  # the fake tower and two operator clients. See ops/scripts/replay-check.sh.
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ground-core/requirements*.txt
      - run: pip install -r ground-core/requirements.txt
      - name: Scenario replay (broker, coordinator, fake tower, operators)
        run: ops/scripts/replay-check.sh
        env:
          PYTHON: python
          REPLAY_STOP_BROKER: "1"
