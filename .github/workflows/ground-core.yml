name: ground-core

on:
  push:
    paths: [ "ground-core/**", "schemas/**", "sim/**", ".github/workflows/ground-core.yml" ]
  pull_request:
    paths: [ "ground-core/**", "schemas/**", "sim/**", ".github/workflows/ground-core.yml" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ground-core/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Schema checks and coordinator unit tests
        run: python -m pytest -q
