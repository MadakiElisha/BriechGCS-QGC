name: Custom Build

# Briech: our plugin lives in custom/ (not custom-example/) and the default
# branch is main, so the stock triggers never fired. See briech-docs/UPSTREAM.md.
on:
  push:
    branches: [main]
    paths:
      - 'custom/**'
      - '.github/workflows/custom-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom/**'
      - '.github/workflows/custom-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    # full: the normal build. no-quick3d: Qt installed without Qt Quick 3D and the
    # 3D viewer off, as on a machine that lacks Quick 3D (handoff, definition of
    # done: "With Quick3D missing, the 2D indicator appears instead").
    name: Custom Plugin Build${{ matrix.variant == 'no-quick3d' && ' (no Quick 3D)' || '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [full, no-quick3d]

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Initial Setup
        uses: ./.github/actions/common

      - name: Install Dependencies
        run: |
          chmod a+x ./tools/setup/install-dependencies-debian.sh
          sudo ./tools/setup/install-dependencies-debian.sh

      - name: Setup Caching
        uses: ./.github/actions/cache
        with:
          host: linux
          target: linux_gcc_64
          build-type: Release
          cpm-modules: ${{ runner.temp }}/build/cpm_modules
          save-cache: false

      - name: Qt modules without Quick 3D
        id: qtmods
        if: matrix.variant == 'no-quick3d'
        run: |
          modules=""
          for m in ${{ steps.config.outputs.qt_modules }}; do
            [[ "$m" == qtquick3d ]] || modules="$modules $m"
          done
          echo "modules=${modules# }" >> "$GITHUB_OUTPUT"
          echo "Qt modules: ${modules# }"

      - name: Install Qt for Linux
        uses: ./.github/actions/qt-install
        with:
          version: ${{ steps.config.outputs.qt_version }}
          host: linux
          arch: linux_gcc_64
          modules: ${{ matrix.variant == 'no-quick3d' && steps.qtmods.outputs.modules || steps.config.outputs.qt_modules }}

      - name: Configure
        working-directory: ${{ runner.temp }}/build
        run: ${{ env.QT_ROOT_DIR }}/bin/qt-cmake -S ${{ github.workspace }} -B . -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              ${{ matrix.variant == 'no-quick3d' && '-DQGC_VIEWER3D=OFF' || '' }}

      - name: Build
        working-directory: ${{ runner.temp }}/build
        run: cmake --build . --target all --config Release --parallel

      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Verify Custom AppImage
        working-directory: ${{ runner.temp }}/build
        run: xvfb-run -a ./BriechUAS-x86_64.AppImage --simple-boot-test

      # --simple-boot-test exits before any QML loads. This starts the real UI
      # and fails on a missing QML module or type, and checks which attitude
      # view the build reports.
      - name: UI smoke test (Modern view loads)
        working-directory: ${{ runner.temp }}/build
        run: xvfb-run -a ${{ github.workspace }}/custom/test/ui-smoke.sh ./BriechUAS-x86_64.AppImage
              "${{ matrix.variant == 'no-quick3d' && '2D fallback' || '3D' }}"
