# Local broker for development: make -C ops broker
name: briech

services:
  broker:
    image: eclipse-mosquitto:2.0.20
    container_name: briech-broker
    restart: unless-stopped
    ports:
      - "${BRIECH_MQTT_PORT:-8883}:8883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      # Only what the broker needs: never the CA key.
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro
      # Only the hashed logins, as one file: never the plain passwords and tokens beside it.
      # (A folder mount also fails on Linux: ops/secrets is owner-only, so the broker's
      # own user could not reach the file and the broker would not start.)
      - ./secrets/mosquitto.passwd:/mosquitto/secrets/mosquitto.passwd:ro
      - broker-data:/mosquitto/data

volumes:
  broker-data:
