# Briech MQTT broker. Mounted into the eclipse-mosquitto container by
# ops/docker-compose.yml:
#   ops/mosquitto/  -> /mosquitto/config   (this file and acl)
#   ops/certs/{ca.crt,server.crt,server.key} -> /mosquitto/certs (scripts/make-certs.sh, not in git)
#   ops/secrets/    -> /mosquitto/secrets  (made by scripts/make-secrets.sh, not in git)

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/mosquitto.passwd
acl_file /mosquitto/config/acl

# TLS only. There is no plain listener: devices reach the broker over the VPN.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Retained status and state survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Bounded queues for slow subscribers: drop rather than grow.
max_queued_messages 1000
max_packet_size 8192

log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe
log_timestamp_format %Y-%m-%dT%H:%M:%S
