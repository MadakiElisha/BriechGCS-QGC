# Watch zones (read-only in the first release). A track of a watched class
# inside a zone raises one alert. These are not geofences: geofences are set on
# the autopilot and enforced by the vehicle, with or without the coordinator.
#
# polygon corners are [lat, lon], WGS84 degrees, in order around the edge.

zones:
  # Near Briech home (8.8933, 7.2642), where the simulated drones start, so a
  # zone alert gets a drone suggested from the test fleet. On the path of
  # sim/scenarios/tower-walk.yaml: track 17 walks in about 20 s after the
  # publisher starts.
  - id: north-fence
    name: north-fence
    severity: high
    classes: [person, vehicle]
    polygon:
      - [8.89550, 7.26680]
      - [8.89550, 7.26800]
      - [8.89670, 7.26800]
      - [8.89670, 7.26680]
